name: Enhanced Testing and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  enhanced-testing:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_code_gen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install enhanced testing tools
      run: |
        go install gotest.tools/gotestsum@latest
        go install github.com/axw/gocov/gocov@latest
        go install github.com/matm/gocov-html/gocov-html@latest
        go install github.com/nikolaydubina/go-cover-treemap@latest
        go install github.com/vladopajic/go-test-coverage/v2@latest

    - name: Run enhanced tests
      run: |
        make install-test-tools
        make test-enhanced
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_code_gen_test?sslmode=disable
        REDIS_URL: redis://localhost:6379

    - name: Generate coverage reports
      run: make test-coverage

    - name: Analyze coverage
      run: make test-analyze

    - name: Check coverage threshold
      run: |
        go-test-coverage --config=.testcoverage.yml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        fail_ci_if_error: true

    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage*.html
          coverage*.svg
          tests-report.xml
        retention-days: 30

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        recreate: true
        path: coverage-summary.txt
