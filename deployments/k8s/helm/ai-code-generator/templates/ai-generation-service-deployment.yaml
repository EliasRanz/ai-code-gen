apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-code-generator.fullname" . }}-ai-generation-service
  labels:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ai-generation-service
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.aiGenerationService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ai-generation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ai-generation-service
    spec:
      containers:
      - name: ai-generation-service
        image: "{{ .Values.aiGenerationService.image.repository }}:{{ .Values.aiGenerationService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.aiGenerationService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8084
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "development" | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.aiGenerationService.config.logLevel | default "info" | quote }}
        - name: REDIS_HOST
          value: {{ include "ai-code-generator.redis.host" . | quote }}
        - name: REDIS_PORT
          value: {{ include "ai-code-generator.redis.port" . | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "ai-code-generator.redis.secretName" . }}
              key: redis-password
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.aiGenerationService.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-code-generator.fullname" . }}-ai-generation-service
  labels:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ai-generation-service
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.aiGenerationService.service.type }}
  ports:
  - port: {{ .Values.aiGenerationService.service.port }}
    targetPort: {{ .Values.aiGenerationService.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ai-generation-service