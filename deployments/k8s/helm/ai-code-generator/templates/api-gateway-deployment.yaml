apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-code-generator.fullname" . }}-api-gateway
  labels:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | default "development" | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.apiGateway.config.logLevel | default "info" | quote }}
        - name: AUTH_SERVICE_URL
          value: "http://{{ include "ai-code-generator.fullname" . }}-auth-service:8081"
        - name: USER_SERVICE_URL
          value: "http://{{ include "ai-code-generator.fullname" . }}-user-service:8082"
        - name: AI_SERVICE_URL
          value: "http://{{ include "ai-code-generator.fullname" . }}-ai-service:8083"
        - name: AI_GENERATION_SERVICE_URL
          value: "http://{{ include "ai-code-generator.fullname" . }}-ai-generation-service:8084"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 12 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-code-generator.fullname" . }}-api-gateway
  labels:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
  - port: {{ .Values.apiGateway.service.port }}
    targetPort: {{ .Values.apiGateway.service.targetPort }}
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: {{ include "ai-code-generator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-gateway